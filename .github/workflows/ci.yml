name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PGUSER: finedge
  PGPASSWORD: finedge

jobs:
  backend:
    name: Backend — lint, unit, integration, mutation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finedge
          POSTGRES_PASSWORD: finedge
          POSTGRES_DB: finedge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finedge -d finedge_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finedge:finedge@localhost:5432/finedge_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-mutation-report
          path: backend/reports/mutation/
          if-no-files-found: ignore

  frontend:
    name: Frontend — lint, unit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build

  e2e:
    name: End-to-end & regression (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finedge
          POSTGRES_PASSWORD: finedge
          POSTGRES_DB: finedge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finedge -d finedge"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://finedge:finedge@localhost:5432/finedge_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:regression
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finedge-backend ./backend
      - run: docker build -t finedge-frontend ./frontend
